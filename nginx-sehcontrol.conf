server {
    listen 80;
    listen [::]:80;
    server_name sehcontrol.sehuacho.com;

    # No registrar URIs: las conexiones pueden transportar tokens en query.
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sehcontrol.sehuacho.com;

    ssl_certificate /etc/letsencrypt/live/sehcontrol.sehuacho.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sehcontrol.sehuacho.com/privkey.pem;

    client_max_body_size 500m;

    # Previsualizacion de ScreenCam: WHEP/WebRTC del gateway multimedia
    # (MediaMTX escucha solo en localhost). Se publica bajo HTTPS para que el
    # panel -que es https- no bloquee la reproduccion por contenido mixto.
    # El acceso lo autoriza el panel via token, no nginx (ver /api/media-auth).
    location /media/ {
        # WHEP puede recibir ?token=...; nunca registrar la URI sensible.
        access_log off;
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WHEP negocia por POST y puede tardar en el intercambio ICE.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # WebSocket autenticado mediante /api/ws?token=...
    location = /api/ws {
        access_log off;
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
