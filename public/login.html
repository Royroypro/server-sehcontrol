<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar - Sehcontrol</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="center-screen">
  <form class="card login-card" id="loginForm">
    <h1>Sehcontrol</h1>
    <p>Inicia sesion con tu cuenta</p>
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Contrasena</label>
    <input id="password" type="password" required autocomplete="current-password">
    <div class="error" id="err"></div>
    <button type="submit" style="width:100%;margin-top:10px;">Ingresar</button>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Error al iniciar sesion'; return; }
    window.location.href = data.role === 'admin' ? '/admin/' : '/client/';
  } catch (e) {
    err.textContent = 'No se pudo conectar con el servidor';
  }
});
</script>
</body>
</html>
