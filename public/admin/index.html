<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin - Sehcontrol</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h2>Sehcontrol Admin</h2>
    <nav>
      <button class="active" data-tab="dashboard">Dashboard</button>
      <button data-tab="users">Usuarios</button>
      <button data-tab="plans">Membresias</button>
      <button data-tab="devices">Equipos</button>
      <button data-tab="payments">Pagos</button>
      <button data-tab="alerts">Alertas / Mensajes</button>
      <button data-tab="activity">Actividad</button>
      <button data-tab="settings">Configuracion</button>
    </nav>
    <button class="secondary logout" onclick="logout()">Cerrar sesion</button>
  </div>
  <div class="main" id="main"></div>
</div>

<script src="/api.js"></script>
<script src="/admin/screenCamPreview.js"></script>
<script>
let PLANS = [];
let USERS = [];
let SETTINGS = { default_currency: 'USD', language: 'es' };
const CURRENCIES = ['USD', 'PEN', 'ARS', 'MXN', 'COP', 'CLP', 'EUR'];

async function loadSettings() {
  try { SETTINGS = await api('/api/admin/settings'); } catch (_) { /* se usa el default local si falla */ }
  return SETTINGS;
}

const tabs = {
  dashboard: renderDashboard,
  users: renderUsers,
  plans: renderPlans,
  devices: renderDevices,
  payments: renderPayments,
  alerts: renderAlerts,
  activity: renderActivity,
  settings: renderSettings,
};

document.querySelectorAll('.sidebar nav button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sidebar nav button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    tabs[btn.dataset.tab]();
  });
});

function closeModal() {
  document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove());
}

// ---------- Dashboard ----------
async function renderDashboard() {
  const main = document.getElementById('main');
  main.innerHTML = '<h1>Dashboard</h1><div id="stats" class="stat-row"></div><div id="renewals"></div>';
  try {
    const s = await api('/api/admin/stats');
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="num">${s.revenueMonthFormatted}</div><div class="label">Ingresos este mes</div></div>
      <div class="stat"><div class="num">${s.revenueTotalFormatted}</div><div class="label">Ingresos totales</div></div>
      <div class="stat"><div class="num">${s.users}</div><div class="label">Usuarios totales</div></div>
      <div class="stat"><div class="num">${s.clients}</div><div class="label">Clientes</div></div>
      <div class="stat"><div class="num">${s.devices}</div><div class="label">Equipos asignados</div></div>
      <div class="stat"><div class="num">${s.expiringSoon}</div><div class="label">Planes por vencer (7 dias)</div></div>
      <div class="stat"><div class="num">${s.expired}</div><div class="label">Planes vencidos</div></div>
      <div class="stat"><div class="num">${s.recentAlerts}</div><div class="label">Alertas (7 dias)</div></div>
      ${!s.hbbsConnected ? '<div class="stat" style="border-color:var(--danger)"><div class="label">No se detecto la base de datos de hbbs (db_v2.sqlite3). El estado en vivo de equipos no esta disponible.</div></div>' : ''}
      ${s.otherCurrencyPaidCount ? `<div class="stat" style="border-color:var(--warn)"><div class="label">${s.otherCurrencyPaidCount} pago(s) pagado(s) en otra moneda (no incluidos arriba) — moneda de la plataforma: ${s.revenueCurrency}</div></div>` : ''}
    `;
    if (s.upcomingRenewals.length) {
      document.getElementById('renewals').innerHTML = `
        <h1 style="font-size:16px;margin-top:24px;">Vencen en los proximos 7 dias</h1>
        <table><thead><tr><th>Email</th><th>Plan</th><th>Vence</th></tr></thead><tbody>
          ${s.upcomingRenewals.map((u) => `<tr><td>${u.email}</td><td>${u.plan_name || '-'}</td><td>${fmtDate(u.plan_expires_at)}</td></tr>`).join('')}
        </tbody></table>`;
    }
  } catch (e) {
    main.innerHTML += `<div class="error">${e.message}</div>`;
  }
}

// ---------- Plans ----------
async function loadPlans() {
  PLANS = await api('/api/admin/plans');
  return PLANS;
}

async function renderPlans() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h1>Membresias / Planes</h1><button onclick="openPlanModal()">+ Nuevo plan</button></div>
    <table><thead><tr><th>Nombre</th><th>Limite equipos</th><th>Precio</th><th>Duracion</th><th>ScreenCam</th><th>Publico</th><th></th></tr></thead>
    <tbody id="plansBody"></tbody></table>
  `;
  await loadPlans();
  const body = document.getElementById('plansBody');
  body.innerHTML = PLANS.length ? PLANS.map((p) => `
    <tr>
      <td>${p.name}</td>
      <td>${p.max_devices}</td>
      <td>${(p.price_cents / 100).toFixed(2)} ${p.currency || 'USD'}</td>
      <td>${p.duration_days} dias</td>
      <td>${p.screen_cam_enabled ? `<span class="badge active">Cupo: ${p.screen_cam_max_streams}</span>` : '<span class="badge">No incluido</span>'}</td>
      <td>
        <label class="switch" title="${p.is_public ? 'Visible en la pagina publica' : 'Oculto en la pagina publica'}">
          <input type="checkbox" ${p.is_public ? 'checked' : ''} onchange="setPlanVisibility(${p.id}, this)">
          <span></span>
        </label>
      </td>
      <td class="row-actions">
        <button class="secondary" onclick='openPlanModal(${JSON.stringify(p)})'>Editar</button>
        <button class="danger" onclick="deletePlan(${p.id})">Borrar</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">Sin planes todavia</td></tr>';
}

async function setPlanVisibility(id, input) {
  input.disabled = true;
  try {
    await api(`/api/admin/plans/${id}`, { method: 'PUT', body: { is_public: input.checked } });
    await loadPlans();
  } catch (e) {
    input.checked = !input.checked;
    alert(e.message);
  } finally {
    input.disabled = false;
  }
}

function openPlanModal(plan) {
  const isEdit = !!plan;
  const defaultCurrency = isEdit ? plan.currency : SETTINGS.default_currency;
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <form class="card modal">
      <h2>${isEdit ? 'Editar plan' : 'Nuevo plan'}</h2>
      <label>Nombre</label><input name="name" required value="${isEdit ? plan.name : ''}">
      <label>Descripcion / beneficios del plan</label>
      <textarea name="description" rows="4" placeholder="Describe lo que incluye este plan"></textarea>
      <label>Limite de equipos</label><input name="max_devices" type="number" min="1" required value="${isEdit ? plan.max_devices : 1}">
      <label>Precio</label>
      <div style="display:flex;gap:8px;">
        <input name="price" type="number" step="0.01" min="0" style="flex:2;" value="${isEdit ? (plan.price_cents / 100).toFixed(2) : 0}">
        <select name="currency" style="flex:1;">
          ${CURRENCIES.map((c) => `<option value="${c}" ${defaultCurrency === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </div>
      <label>Duracion (dias)</label><input name="duration_days" type="number" min="1" required value="${isEdit ? plan.duration_days : 30}">
      <label class="check-label">
        <input name="is_public" type="checkbox" ${isEdit ? (plan.is_public ? 'checked' : '') : 'checked'}>
        Mostrar este plan en la pagina publica
      </label>
      <hr style="margin:16px 0;border-color:var(--border,#333);">
      <label class="check-label">
        <input name="screencam_enabled" type="checkbox" ${isEdit && plan.screen_cam_enabled ? 'checked' : ''}>
        Incluye ScreenCam (pantalla -> RTSP)
      </label>
      <label>Cupo de equipos simultaneos</label>
      <input name="screencam_max_streams" type="number" min="0" value="${isEdit && plan.screen_cam_max_streams != null ? plan.screen_cam_max_streams : 1}">
      <label>Modo por defecto</label>
      <select name="screencam_mode">
        <option value="local" ${isEdit && plan.screen_cam_mode === 'local' ? 'selected' : ''}>Local (el equipo decide)</option>
        <option value="managed" ${!isEdit || !plan.screen_cam_mode || plan.screen_cam_mode === 'managed' ? 'selected' : ''}>Administrado</option>
        <option value="supervised" ${isEdit && plan.screen_cam_mode === 'supervised' ? 'selected' : ''}>Supervision permanente (no se puede apagar localmente)</option>
      </select>
      <div class="error" id="modalErr"></div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>`;
  document.body.appendChild(div);
  if (isEdit) div.querySelector('[name="description"]').value = plan.description || '';
  div.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const payload = {
      name: f.name.value,
      description: f.description.value,
      max_devices: Number(f.max_devices.value),
      price_cents: Math.round(Number(f.price.value) * 100),
      currency: f.currency.value,
      duration_days: Number(f.duration_days.value),
      is_public: f.is_public.checked,
    };
    try {
      let planId = isEdit ? plan.id : null;
      if (isEdit) await api(`/api/admin/plans/${plan.id}`, { method: 'PUT', body: payload });
      else planId = (await api('/api/admin/plans', { method: 'POST', body: payload })).id;
      await api(`/api/admin/plans/${planId}/screen-cam`, {
        method: 'PUT',
        body: {
          enabled: f.screencam_enabled.checked,
          mode: f.screencam_mode.value,
          max_streams: Number(f.screencam_max_streams.value) || 0,
        },
      });
      closeModal();
      renderPlans();
    } catch (err) {
      div.querySelector('#modalErr').textContent = err.message;
    }
  });
}

async function deletePlan(id) {
  if (!confirm('¿Borrar este plan?')) return;
  try { await api(`/api/admin/plans/${id}`, { method: 'DELETE' }); renderPlans(); }
  catch (e) { alert(e.message); }
}

// ---------- Users ----------
async function renderUsers() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h1>Usuarios</h1><button onclick="openUserModal()">+ Nuevo usuario</button></div>
    <table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Plan</th><th>Equipos</th><th>Vence</th><th>Estado</th><th></th></tr></thead>
    <tbody id="usersBody"></tbody></table>
  `;
  await loadPlans();
  USERS = await api('/api/admin/users');
  const body = document.getElementById('usersBody');
  body.innerHTML = USERS.length ? USERS.map((u) => `
    <tr>
      <td>${u.name || '-'}</td>
      <td>${u.email}</td>
      <td><span class="badge ${u.role === 'admin' ? 'admin' : ''}">${u.role}</span></td>
      <td>${u.plan_name ? `${u.plan_name} (${u.max_devices})` : '-'}</td>
      <td>${u.device_count}${u.max_devices ? ' / ' + u.max_devices : ''}</td>
      <td>${fmtDate(u.plan_expires_at)} ${planBadge(u.plan_expires_at)}</td>
      <td><span class="badge ${u.status}">${u.status}</span></td>
      <td class="row-actions">
        <button class="secondary" onclick='openUserModal(${JSON.stringify(u)})'>Editar</button>
        <button class="secondary" onclick="goToAccountDevices(${u.id})">Equipos / ScreenCam</button>
        <button class="danger" onclick="deleteUser(${u.id})">Borrar</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty">Sin usuarios todavia</td></tr>';
}

// Atajo desde Usuarios: cambia a la pestana Equipos y abre/desplaza a la
// tarjeta de esa cuenta, en vez de duplicar la vista de equipos en un modal.
function goToAccountDevices(userId) {
  document.querySelectorAll('.sidebar nav button').forEach((b) => b.classList.remove('active'));
  document.querySelector('[data-tab="devices"]').classList.add('active');
  renderDevices().then(() => {
    const card = document.querySelector(`.account-card[data-owner-id="${userId}"]`);
    if (card) {
      card.open = true;
      if (!card.dataset.scLoaded) { card.dataset.scLoaded = '1'; loadAccountScreenCam(userId); }
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
}

function openUserModal(user) {
  const isEdit = !!user;
  const planOptions = ['<option value="">Sin plan</option>']
    .concat(PLANS.map((p) => `<option value="${p.id}" ${isEdit && user.plan_id === p.id ? 'selected' : ''}>${p.name}</option>`))
    .join('');
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <form class="card modal">
      <h2>${isEdit ? 'Editar usuario' : 'Nuevo usuario'}</h2>
      <label>Nombre</label><input name="name" value="${isEdit ? (user.name || '') : ''}" placeholder="ej. Juan Perez">
      <label>Email</label><input name="email" type="email" required value="${isEdit ? user.email : ''}">
      <label>${isEdit ? 'Nueva contrasena (opcional)' : 'Contrasena'}</label>
      <input name="password" type="password" ${isEdit ? '' : 'required'}>
      <label>Rol</label>
      <select name="role">
        <option value="client" ${isEdit && user.role === 'client' ? 'selected' : ''}>Cliente</option>
        <option value="admin" ${isEdit && user.role === 'admin' ? 'selected' : ''}>Administrador</option>
      </select>
      <label>Plan</label>
      <select name="plan_id">${planOptions}</select>
      ${isEdit ? `
      <label><input type="checkbox" name="renew" style="width:auto;display:inline-block;margin-right:6px;">Renovar plan desde hoy (recalcula las fechas de abajo)</label>
      <label>Fecha de inicio</label><input name="plan_started_at" type="date" value="${toDateInputValue(user.plan_started_at)}">
      <label>Fecha de vencimiento</label><input name="plan_expires_at" type="date" value="${toDateInputValue(user.plan_expires_at)}">
      <label>Estado</label>
      <select name="status">
        <option value="active" ${user.status === 'active' ? 'selected' : ''}>Activo</option>
        <option value="suspended" ${user.status === 'suspended' ? 'selected' : ''}>Suspendido</option>
      </select>` : ''}
      <div class="error" id="modalErr"></div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>`;
  document.body.appendChild(div);
  div.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      if (isEdit) {
        await api(`/api/admin/users/${user.id}`, {
          method: 'PUT',
          body: {
            name: f.name.value,
            email: f.email.value,
            role: f.role.value,
            status: f.status.value,
            plan_id: f.plan_id.value || null,
            password: f.password.value || undefined,
            renew: f.renew.checked,
            plan_started_at: f.plan_started_at.value ? new Date(f.plan_started_at.value).toISOString() : null,
            plan_expires_at: f.plan_expires_at.value ? new Date(f.plan_expires_at.value).toISOString() : null,
          },
        });
      } else {
        await api('/api/admin/users', {
          method: 'POST',
          body: { name: f.name.value, email: f.email.value, password: f.password.value, role: f.role.value, plan_id: f.plan_id.value || null },
        });
      }
      closeModal();
      renderUsers();
    } catch (err) {
      div.querySelector('#modalErr').textContent = err.message;
    }
  });
}

async function deleteUser(id) {
  if (!confirm('¿Borrar este usuario y sus equipos asignados?')) return;
  try { await api(`/api/admin/users/${id}`, { method: 'DELETE' }); renderUsers(); }
  catch (e) { alert(e.message); }
}

// ---------- Devices (agrupados por cuenta, acordeon) ----------
async function renderDevices() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h1>Equipos por cuenta</h1><button onclick="openDeviceModal()">+ Asignar equipo</button></div>
    <div id="accountsList">Cargando...</div>
  `;
  await loadPlans();
  USERS = await api('/api/admin/users');
  const devices = await api('/api/admin/devices');

  const byOwner = new Map();
  for (const d of devices) {
    if (!byOwner.has(d.owner_id)) byOwner.set(d.owner_id, []);
    byOwner.get(d.owner_id).push(d);
  }

  const list = document.getElementById('accountsList');
  if (byOwner.size === 0) {
    list.innerHTML = '<div class="empty">Sin equipos asignados todavia</div>';
    return;
  }

  list.innerHTML = [...byOwner.entries()].map(([ownerId, devs]) => {
    const user = USERS.find((u) => u.id === ownerId);
    const email = user ? user.email : devs[0].owner_email;
    const planLabel = user?.plan_name
      ? `${user.plan_name} - ${devs.length}${user.max_devices ? '/' + user.max_devices : ''} equipo(s)`
      : `${devs.length} equipo(s)`;
    return `
    <details class="card account-card" data-owner-id="${ownerId}">
      <summary>
        <div class="account-summary-info">
          <strong>${user?.name ? user.name + ' - ' : ''}${email}</strong>
          <span class="label">${planLabel}</span>
          <span class="label" id="sc-summary-${ownerId}">ScreenCam: -</span>
        </div>
        ${user ? `<span class="badge ${user.status}">${user.status}</span>` : ''}
      </summary>
      <div class="account-body">
        <div id="sc-override-${ownerId}" style="margin-bottom:14px;"></div>
        <table><thead><tr><th>ID Sehcontrol</th><th>Alias</th><th>Estado</th><th>Equipo</th><th>Usuario</th><th>IP</th><th>Asignado</th><th>ScreenCam</th><th></th></tr></thead>
        <tbody id="devicesBody-${ownerId}">
          ${devs.map((d) => `
          <tr data-rustdesk-id="${d.rustdesk_id}">
            <td>${d.rustdesk_id}</td>
            <td>${d.alias || '-'}</td>
            <td>${deviceStatusBadge(d.live)}</td>
            <td>${d.live?.hostname || '-'}${d.live?.os ? `<br><span style="font-size:11px;color:var(--muted)">${d.live.os}</span>` : ''}</td>
            <td>${d.live?.username || '-'}</td>
            <td>${d.live?.last_known_ip || '-'}</td>
            <td>${fmtDate(d.claimed_at)}</td>
            <td class="sc-cell">-</td>
            <td class="row-actions"><button class="danger" onclick="unassignDevice(${d.id})">Quitar</button></td>
          </tr>`).join('')}
        </tbody></table>
      </div>
    </details>`;
  }).join('');

  document.querySelectorAll('.account-card').forEach((card) => {
    card.addEventListener('toggle', () => {
      if (card.open && !card.dataset.scLoaded) {
        card.dataset.scLoaded = '1';
        loadAccountScreenCam(Number(card.dataset.ownerId));
      }
    });
  });
}

// Carga perezosa (solo al expandir una cuenta): cupo de la cuenta + estado
// real de ScreenCam por equipo, mezclado con las filas ya renderizadas.
async function loadAccountScreenCam(ownerId) {
  const summary = document.getElementById(`sc-summary-${ownerId}`);
  let data;
  try {
    data = await api(`/api/admin/users/${ownerId}/screen-cam`);
  } catch (e) {
    if (summary) summary.textContent = 'ScreenCam: error al cargar';
    return;
  }

  const m = data.module;
  if (summary) {
    summary.textContent = m.available ? `ScreenCam: ${m.used_slots}/${m.max_slots} en uso` : 'ScreenCam: no disponible';
  }

  const overrideDiv = document.getElementById(`sc-override-${ownerId}`);
  if (overrideDiv) {
    overrideDiv.innerHTML = `
      <form onsubmit="return saveAccountScreenCam(event, ${ownerId})" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--border);border-radius:8px;">
        <label class="check-label" style="margin:0;width:auto;"><input type="checkbox" name="enabled" style="width:auto;" ${m.available ? 'checked' : ''}> Modulo disponible para esta cuenta</label>
        <label style="margin:0;width:auto;">Cupo:</label>
        <input type="number" name="max_streams" min="0" style="width:80px;" value="${m.max_slots ?? ''}">
        <button type="submit" class="secondary">Guardar</button>
        <span class="error" id="scErr-${ownerId}" style="margin:0;"></span>
      </form>`;
  }

  const byId = new Map(data.devices.map((d) => [d.rustdesk_id, d]));
  document.querySelectorAll(`#devicesBody-${ownerId} tr`).forEach((row) => {
    const d = byId.get(row.dataset.rustdeskId);
    const cell = row.querySelector('.sc-cell');
    if (!cell) return;
    if (!d) { cell.textContent = '-'; return; }
    SCREEN_CAM_CACHE[d.rustdesk_id] = d;
    const smallBtn = 'style="margin-top:4px;margin-right:4px;font-size:11px;padding:3px 8px;"';
    cell.innerHTML = `
      ${d.active ? '<span class="badge active">Activo</span>' : '<span class="badge">Inactivo</span>'}
      ${d.auth_mismatch ? '<span class="badge suspended" title="El panel emitio credenciales pero el equipo reporta el stream sin autenticacion">Auth sin aplicar</span>' : ''}
      ${d.last_error ? `<br><span style="color:var(--danger);font-size:11px;">${d.last_error}</span>` : ''}
      ${d.rtsp_url ? `<br><span style="font-size:11px;color:var(--muted);">${d.rtsp_url}</span>` : ''}
      ${d.rtsp_user ? `
        <br><button type="button" class="secondary" ${smallBtn} onclick="showScreenCamCredentials('${d.rustdesk_id}')">Ver credenciales</button>
      ` : ''}
      ${renderDisplayControls(d, ownerId)}
      <br>
      <button class="secondary" ${smallBtn} onclick="toggleDeviceScreenCamInline('${d.rustdesk_id}', ${!d.active}, ${ownerId})">${d.active ? 'Apagar' : 'Encender'}</button>
      ${d.active ? `<button class="secondary" ${smallBtn} onclick="regenerateScreenCamCredentials('${d.rustdesk_id}', ${ownerId})">Regenerar credenciales</button>` : ''}
      ${d.rtsp_user ? `<button class="secondary" ${smallBtn} onclick="clearScreenCamCredentials('${d.rustdesk_id}', ${ownerId})">Quitar auth</button>` : ''}
      ${d.active ? `<button class="secondary" ${smallBtn} onclick="openScreenCamPreview('${d.rustdesk_id}')">Ver previsualizacion</button>` : ''}
    `;
  });
}

async function saveAccountScreenCam(e, ownerId) {
  e.preventDefault();
  const f = e.target;
  try {
    await api(`/api/admin/users/${ownerId}/screen-cam`, {
      method: 'PUT',
      body: { enabled: f.enabled.checked, max_streams: f.max_streams.value === '' ? null : Number(f.max_streams.value) },
    });
    loadAccountScreenCam(ownerId);
  } catch (err) {
    const errEl = document.getElementById(`scErr-${ownerId}`);
    if (errEl) errEl.textContent = err.message;
  }
  return false;
}

async function toggleDeviceScreenCamInline(rustdeskId, enable, ownerId) {
  try {

const SCREEN_CAM_CACHE = {};

// ---------- Seleccion remota de pantalla ----------
function renderDisplayControls(d, ownerId) {
  const st = d.displays;
  if (!d.active) return '';
  if (!st || !st.supports_display_selection) {
    return '<br><span style="font-size:11px;color:var(--muted);">Este cliente todavia no admite seleccion remota de pantalla.</span>';
  }
  const options = st.displays.map((s) => {
    const label = `${s.name || s.display_id}${s.width && s.height ? ` — ${s.width}×${s.height}` : ''}${s.connected === false ? ' (desconectada)' : ''}`;
    return `<option value="${encodeURIComponent(s.display_id)}" ${s.display_id === st.selected_display_id ? 'selected' : ''}>${label}</option>`;
  }).join('');
  const activeLabel = st.active_display_name || st.active_display_id || '-';
  return `
    <br><span style="font-size:11px;color:var(--muted);">Pantalla activa: ${activeLabel} · ${st.displays.length} detectada(s)</span>
    ${st.change_pending ? '<br><span class="badge warn">Aplicando cambio de pantalla…</span>' : ''}
    ${st.fallback_active ? `<br><span class="badge warn" title="${st.display_warning || ''}">Usando pantalla principal temporalmente</span>` : ''}
    ${st.display_warning ? `<br><span style="font-size:11px;color:var(--warn,#b8860b);">${st.display_warning}</span>` : ''}
    <br><select style="font-size:11px;padding:3px;width:auto;margin-top:4px;" onchange="changeScreenCamDisplay('${d.rustdesk_id}', ${ownerId}, this)">${options}</select>
  `;
}

// Un cambio de pantalla no es inmediato: el equipo tiene que reconstruir el
// capturador y el encoder, y recien despues informa la pantalla activa nueva.
// Hasta entonces `change_pending` es true y se muestra "Aplicando cambio…".
//
// El panel no tiene WebSocket, y `changeScreenCamDisplay` refrescaba una sola
// vez, justo cuando el cambio no podia estar aplicado todavia. El cartel
// quedaba congelado hasta que el admin recargaba a mano, aunque el equipo ya
// hubiera cambiado de pantalla hace rato. De ahi este sondeo acotado.
//
// Se consulta la API y solo se vuelve a dibujar cuando el estado cambia de
// verdad, en vez de re-renderizar cada dos segundos: redibujar destruye el
// <select> y perderia la interaccion si el admin lo esta usando.
const DISPLAY_CHANGE_POLL_MS = 2000;
// Margen para el peor caso razonable: la reconfiguracion espera al encoder por
// hardware, que puede tardar decenas de segundos en aparecer tras un cambio de
// topologia. Vencido el plazo se deja de sondear y se dibuja lo ultimo que se
// sepa -- el cartel sigue siendo correcto si el equipo de verdad no respondio.
const DISPLAY_CHANGE_TIMEOUT_MS = 90000;
const DISPLAY_CHANGE_POLLERS = {};

function stopDisplayChangePolling(ownerId) {
  const entry = DISPLAY_CHANGE_POLLERS[ownerId];
  if (!entry) return;
  clearTimeout(entry.timer);
  delete DISPLAY_CHANGE_POLLERS[ownerId];
}

function startDisplayChangePolling(ownerId, rustdeskId) {
  // Un cambio nuevo reemplaza al anterior: nunca dos sondeos para la misma
  // cuenta compitiendo por redibujar la misma fila.
  stopDisplayChangePolling(ownerId);

  const entry = { timer: null, deadline: Date.now() + DISPLAY_CHANGE_TIMEOUT_MS };
  DISPLAY_CHANGE_POLLERS[ownerId] = entry;

  const finish = () => {
    if (DISPLAY_CHANGE_POLLERS[ownerId] !== entry) return;
    stopDisplayChangePolling(ownerId);
    loadAccountScreenCam(ownerId);
  };

  const tick = async () => {
    if (DISPLAY_CHANGE_POLLERS[ownerId] !== entry) return;
    // El acordeon de la cuenta se cerro o la vista cambio: no hay nada que
    // actualizar y seguir sondeando solo gastaria peticiones.
    if (!document.getElementById(`devicesBody-${ownerId}`)) {
      stopDisplayChangePolling(ownerId);
      return;
    }
    if (Date.now() >= entry.deadline) {
      finish();
      return;
    }
    try {
      const data = await api(`/api/admin/users/${ownerId}/screen-cam`);
      if (DISPLAY_CHANGE_POLLERS[ownerId] !== entry) return;
      const device = data.devices.find((d) => d.rustdesk_id === rustdeskId);
      // Si el equipo ya no figura, o ya no informa pantallas, no hay cambio
      // pendiente que esperar.
      if (!device || !device.displays || !device.displays.change_pending) {
        finish();
        return;
      }
    } catch (_) {
      // Un fallo puntual de red no cancela el sondeo: se reintenta hasta que
      // venza el plazo.
    }
    if (DISPLAY_CHANGE_POLLERS[ownerId] !== entry) return;
    entry.timer = setTimeout(tick, DISPLAY_CHANGE_POLL_MS);
  };

  entry.timer = setTimeout(tick, DISPLAY_CHANGE_POLL_MS);
}

async function changeScreenCamDisplay(rustdeskId, ownerId, select) {
  const displayId = decodeURIComponent(select.value);
  const displayName = select.options[select.selectedIndex].text.split(' — ')[0];
  select.disabled = true;
  try {
    await api(`/api/admin/devices/${rustdeskId}/screen-cam/display`, {
      method: 'PUT',
      body: { display_id: displayId, display_name: displayName },
    });
    loadAccountScreenCam(ownerId);
    startDisplayChangePolling(ownerId, rustdeskId);
  } catch (e) {
    alert(e.message);
    select.disabled = false;
  }
}

// ---------- Previsualizacion de video (WebRTC / WHEP) ----------
let PREVIEW_STATE = null;
// Mientras MediaMTX todavia no confirma publisher (playback_ready === false)
// se sigue consultando rapido pero SIN abrir PeerConnection todavia -- evita
// 404 innecesarios contra WHEP. El resto de los casos usa el intervalo lento.
const PREVIEW_FAST_POLL_MS = 400;
const PREVIEW_SLOW_POLL_MS = 1500;

async function openScreenCamPreview(rustdeskId) {
  if (PREVIEW_STATE) return;
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="card modal" style="width:820px;max-width:95vw;">
      <h2>Previsualizacion en vivo</h2>
      <div id="pvStatus" style="font-size:13px;color:var(--muted);">Conectando con el dispositivo…</div>
      <video id="pvVideo" autoplay playsinline muted style="width:100%;background:#000;border-radius:8px;margin-top:12px;display:none;"></video>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:space-between;align-items:center;">
        <span id="pvTimer" style="font-size:12px;color:var(--muted);"></span>
        <span>
          <button type="button" class="secondary" onclick="document.getElementById('pvVideo').requestFullscreen?.()">Pantalla completa</button>
          <button type="button" class="danger" onclick="closeScreenCamPreview()">Finalizar</button>
        </span>
      </div>
    </div>`;
  document.body.appendChild(div);

  const state = {
    rustdeskId,
    sessionId: null,
    controller: null,
    poll: null,
    timer: null,
    deadline: null,
    requestAbort: new AbortController(),
    beaconSent: false,
    previewRequestedAt: Date.now(),
  };
  PREVIEW_STATE = state;

  try {
    const session = await api(`/api/admin/devices/${rustdeskId}/screen-cam/preview`, {
      method: 'POST',
      signal: state.requestAbort.signal,
    });
    if (PREVIEW_STATE !== state) {
      // El admin pudo cerrar el modal mientras el POST seguia en vuelo.
      try {
        await api(`/api/admin/devices/${rustdeskId}/screen-cam/preview/${session.session_id}`, { method: 'DELETE' });
      } catch (_) { /* la sesion expira sola igual */ }
      return;
    }
    state.sessionId = session.session_id;
    state.deadline = Date.now() + session.expires_in * 1000;
    setPreviewStatus('Esperando senal de ScreenCam…');
    startPreviewPolling(state);
  } catch (e) {
    if (PREVIEW_STATE === state && e.name !== 'AbortError') {
      setPreviewStatus(`No se pudo iniciar: ${e.message}`, true);
    }
  }
}

function setPreviewStatus(text, isError) {
  const el = document.getElementById('pvStatus');
  if (el) { el.textContent = text; el.style.color = isError ? 'var(--danger)' : 'var(--muted)'; }
}

function isPreviewSessionActive(state) {
  return PREVIEW_STATE === state && !!state.sessionId;
}

// El cliente tarda en conectarse al gateway; se consulta el estado de la
// sesion hasta que MediaMTX confirme publisher (o falle/expire). Una vez hay
// un controller de WHEP activo (ver screenCamPreview.js), es EL QUIEN decide
// sus propios reintentos/backoff -- el poll solo vigila el fin de sesion.
function startPreviewPolling(state) {
  if (PREVIEW_STATE !== state) return;
  state.timer = setInterval(() => {
    if (PREVIEW_STATE !== state) return;
    const left = Math.max(0, Math.round((state.deadline - Date.now()) / 1000));
    const el = document.getElementById('pvTimer');
    if (el) el.textContent = `Tiempo restante: ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
    if (left <= 0) closeScreenCamPreview();
  }, 1000);

  const poll = async () => {
    if (!isPreviewSessionActive(state)) return;
    try {
      const s = await api(`/api/admin/devices/${state.rustdeskId}/screen-cam/preview/${state.sessionId}`);
      if (!isPreviewSessionActive(state)) return;
      if (['failed', 'expired', 'stopped'].includes(s.status)) {
        state.controller?.cancel();
        state.controller = null;
        setPreviewStatus(`La sesion termino (${s.status})${s.error ? `: ${s.error}` : ''}`, true);
        return;
      }
      if (s.status === 'ready' && s.playback_url && !state.controller) {
        if (s.playback_ready === false) {
          // MediaMTX confirma que todavia no hay publisher: se espera sin
          // abrir PeerConnection (los 404 durante esta fase no son un error
          // definitivo, pero tampoco hace falta provocarlos).
          if (PREVIEW_STATE === state) state.poll = setTimeout(poll, PREVIEW_FAST_POLL_MS);
          return;
        }
        startWhepController(s.playback_url, state);
        return; // el controller queda vivo por su cuenta (reintentos/frame)
      }
    } catch (_) { /* reintenta en el proximo tick */ }
    if (PREVIEW_STATE === state) state.poll = setTimeout(poll, PREVIEW_SLOW_POLL_MS);
  };
  state.poll = setTimeout(poll, 0);
}

// Arma el controller de WHEP (reintento con backoff, invariantes de una sola
// PeerConnection/fetch/timer, y el "gate" que oculta el video hasta el
// primer frame real). El panel solo reacciona a sus callbacks.
function startWhepController(whepUrl, state) {
  state.controller = ScreenCamPreview.createWhepController({
    whepUrl,
    getVideoElement: () => document.getElementById('pvVideo'),
    isSessionActive: () => isPreviewSessionActive(state),
    onStatus: (text, isError) => { if (isPreviewSessionActive(state)) setPreviewStatus(text, isError); },
    onFirstFrame: () => {
      if (!isPreviewSessionActive(state)) return;
      const video = document.getElementById('pvVideo');
      if (video) video.style.display = 'block';
    },
    onTerminal: (reason) => {
      if (isPreviewSessionActive(state) && (reason === 'fatal_failure' || reason === 'congestion_retry_limit')) {
        setPreviewStatus('No se pudo reproducir la senal', true);
      }
      if (state.controller) state.controller = null;
    },
    onTiming: (marks, durations) => {
      // Solo duraciones: nunca se registra la URL de WHEP ni el token.
      if (Object.keys(durations).length) console.log('[screencam] tiempos de previsualizacion', durations);
    },
  });
  state.controller.start(state.previewRequestedAt);
}

async function closeScreenCamPreview() {
  const state = PREVIEW_STATE;
  PREVIEW_STATE = null;
  if (state) {
    state.requestAbort.abort();
    clearTimeout(state.poll);
    clearInterval(state.timer);
    state.controller?.cancel();
    state.controller = null;
    if (state.sessionId) {
      try {
        await api(`/api/admin/devices/${state.rustdeskId}/screen-cam/preview/${state.sessionId}`, { method: 'DELETE' });
      } catch (_) { /* la sesion expira sola igual */ }
    }
  }
  closeModal();
}

// Si el admin cierra la pestana, se corta la publicacion igual.
function stopPreviewOnPageExit() {
  const state = PREVIEW_STATE;
  if (!state?.sessionId || state.beaconSent) return;
  state.beaconSent = true;
  navigator.sendBeacon?.(`/api/admin/devices/${state.rustdeskId}/screen-cam/preview/${state.sessionId}/beacon-stop`);
}
window.addEventListener('pagehide', stopPreviewOnPageExit);
window.addEventListener('beforeunload', stopPreviewOnPageExit);

// Muchos DVR/NVR se configuran desde su propia pantalla (control remoto o
// teclado tactil), sin portapapeles disponible -- hace falta poder LEER las
// credenciales en texto grande para tipearlas a mano, no solo copiarlas.
function showScreenCamCredentials(rustdeskId) {
  const d = SCREEN_CAM_CACHE[rustdeskId];
  if (!d) return;
  const fullUrl = d.rtsp_url
    ? d.rtsp_url.replace('rtsp://', `rtsp://${d.rtsp_user}:${d.rtsp_password}@`)
    : null;
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <div class="card modal" style="width:480px;max-width:90vw;">
      <h2>Credenciales RTSP</h2>
      <p style="font-size:12px;color:var(--muted);margin-top:-8px;">${d.alias || d.rustdesk_id}</p>
      <label>Usuario</label>
      <div style="font-size:20px;font-family:monospace;padding:10px;border:1px solid var(--border);border-radius:6px;user-select:all;">${d.rtsp_user}</div>
      <label>Contraseña</label>
      <div style="font-size:20px;font-family:monospace;padding:10px;border:1px solid var(--border);border-radius:6px;user-select:all;">${d.rtsp_password}</div>
      ${fullUrl ? `
      <label>URL completa (con credenciales)</label>
      <div style="font-size:13px;font-family:monospace;padding:10px;border:1px solid var(--border);border-radius:6px;user-select:all;word-break:break-all;">${fullUrl}</div>
      ` : ''}
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="secondary" onclick="copyScreenCamText('${d.rtsp_user}:${d.rtsp_password}')">Copiar usuario:contraseña</button>
        <button type="button" onclick="closeModal()">Cerrar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}


async function openDeviceModal() {
  const userOptions = USERS.map((u) => `<option value="${u.id}">${u.name ? u.name + ' - ' : ''}${u.email} (${u.device_count}${u.max_devices ? '/' + u.max_devices : ''})</option>`).join('');
  let unclaimed = [];
  try { unclaimed = await api('/api/admin/devices/unclaimed'); } catch (_) { /* si falla, se sigue con entrada manual */ }
  const pickerOptions = ['<option value="">-- Escribir el ID manualmente --</option>']
    .concat(unclaimed.map((p) => {
      const label = p.hostname ? `${p.hostname} (${p.rustdesk_id})` : p.rustdesk_id;
      const extra = [p.online ? 'en linea' : null, p.last_known_ip].filter(Boolean).join(', ');
      return `<option value="${p.rustdesk_id}">${label}${extra ? ' - ' + extra : ''}</option>`;
    }))
    .join('');
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <form class="card modal">
      <h2>Asignar equipo</h2>
      ${unclaimed.length ? `
      <label>Equipos registrados sin asignar (${unclaimed.length})</label>
      <select name="picker">${pickerOptions}</select>
      ` : '<p style="font-size:12px;color:var(--muted);margin-top:12px;">No hay equipos registrados en el servidor sin asignar todavia. Escribe el ID manualmente.</p>'}
      <label>ID de Sehcontrol</label><input name="rustdesk_id" required placeholder="ej. 123456789">
      <label>Alias (opcional)</label><input name="alias" placeholder="ej. Laptop de Juan">
      <label>Propietario</label><select name="owner_user_id" required>${userOptions}</select>
      <div class="error" id="modalErr"></div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit">Asignar</button>
      </div>
    </form>`;
  document.body.appendChild(div);
  const picker = div.querySelector('[name="picker"]');
  if (picker) {
    picker.addEventListener('change', () => {
      div.querySelector('[name="rustdesk_id"]').value = picker.value;
    });
  }
  div.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await api('/api/admin/devices', {
        method: 'POST',
        body: { rustdesk_id: f.rustdesk_id.value, alias: f.alias.value, owner_user_id: Number(f.owner_user_id.value) },
      });
      closeModal();
      renderDevices();
    } catch (err) {
      div.querySelector('#modalErr').textContent = err.message;
    }
  });
}

async function unassignDevice(id) {
  if (!confirm('¿Quitar este equipo del usuario?')) return;
  try { await api(`/api/admin/devices/${id}`, { method: 'DELETE' }); renderDevices(); }
  catch (e) { alert(e.message); }
}

async function renderAlerts() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h1>Alertas y mensajes</h1>
      <div style="display:flex;gap:8px;">
        <button class="secondary" onclick="checkExpiryNow()">Revisar vencimientos ahora</button>
        <button onclick="openMessageModal()">+ Mandar mensaje</button>
      </div>
    </div>
    <table><thead><tr><th>Tipo</th><th>Destinatario</th><th>Titulo</th><th>Mensaje</th><th>Email</th><th>Fecha</th></tr></thead>
    <tbody id="alertsBody"></tbody></table>
  `;
  await loadPlans();
  USERS = await api('/api/admin/users');
  const alerts = await api('/api/admin/alerts');
  const body = document.getElementById('alertsBody');
  body.innerHTML = alerts.length ? alerts.map((a) => `
    <tr>
      <td><span class="badge ${a.type === 'expired' || a.type === 'suspended' ? 'suspended' : a.type === 'expiry_warning' ? 'warn' : ''}">${a.type}</span></td>
      <td>${a.user_email || 'Todos'}</td>
      <td>${a.title}</td>
      <td>${a.message}</td>
      <td>${a.email_sent ? '✓' : '-'}</td>
      <td>${fmtDate(a.created_at)}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">Sin alertas todavia</td></tr>';
}

async function checkExpiryNow() {
  try {
    const res = await api('/api/admin/alerts/check-expiry', { method: 'POST' });
    alert(`Se generaron ${res.created} alerta(s) nueva(s).`);
    renderAlerts();
  } catch (e) { alert(e.message); }
}

function openMessageModal() {
  const userOptions = ['<option value="">Todos los clientes (broadcast)</option>']
    .concat(USERS.filter((u) => u.role === 'client').map((u) => `<option value="${u.id}">${u.name ? u.name + ' - ' : ''}${u.email}</option>`))
    .join('');
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.innerHTML = `
    <form class="card modal">
      <h2>Mandar mensaje</h2>
      <label>Destinatario</label><select name="user_id">${userOptions}</select>
      <label>Titulo</label><input name="title" required>
      <label>Mensaje</label><input name="message" required>
      <label><input type="checkbox" name="email" style="width:auto;display:inline-block;margin-right:6px;">Tambien enviar por correo (requiere SMTP configurado)</label>
      <div class="error" id="modalErr"></div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit">Mandar</button>
      </div>
    </form>`;
  document.body.appendChild(div);
  div.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await api('/api/admin/alerts/message', {
        method: 'POST',
        body: {
          user_id: f.user_id.value ? Number(f.user_id.value) : null,
          title: f.title.value,
          message: f.message.value,
          email: f.email.checked,
        },
      });
      closeModal();
      renderAlerts();
    } catch (err) {
      div.querySelector('#modalErr').textContent = err.message;
    }
  });
}

function formatFileSize(bytes) {
  if (bytes < 1024 * 1024) return `${Math.ceil(bytes / 1024)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

const CLIENT_PLATFORMS = {
  windows: {
    statusEl: 'clientDownloadStatus',
    downloadEl: 'adminClientDownload',
    errEl: 'clientUploadErr',
    okEl: 'clientUploadOk',
    fieldName: 'client_exe',
    ext: '.exe',
    label: 'sehcontrol.exe',
  },
  android: {
    statusEl: 'clientDownloadStatusAndroid',
    downloadEl: 'adminClientDownloadAndroid',
    errEl: 'clientUploadErrAndroid',
    okEl: 'clientUploadOkAndroid',
    fieldName: 'client_apk',
    ext: '.apk',
    label: 'sehcontrol.apk',
  },
};

async function refreshClientDownloadStatus() {
  try {
    const info = await api('/api/admin/settings/client-download');
    for (const [platform, ids] of Object.entries(CLIENT_PLATFORMS)) {
      const statusEl = document.getElementById(ids.statusEl);
      const downloadEl = document.getElementById(ids.downloadEl);
      const platformInfo = info[platform];
      if (!platformInfo || !platformInfo.available) {
        statusEl.textContent = 'No hay un archivo publicado.';
        downloadEl.hidden = true;
        continue;
      }
      statusEl.textContent = `Publicado: ${platformInfo.filename} | ${formatFileSize(platformInfo.size_bytes)} | ${fmtDate(platformInfo.updated_at)}`;
      downloadEl.hidden = false;
    }
  } catch (e) {
    for (const ids of Object.values(CLIENT_PLATFORMS)) {
      document.getElementById(ids.errEl).textContent = e.message;
    }
  }
}

function uploadClientHandler(platform) {
  const ids = CLIENT_PLATFORMS[platform];
  return async function (event) {
    event.preventDefault();
    const form = event.target;
    const file = form[ids.fieldName].files[0];
    const errEl = document.getElementById(ids.errEl);
    const okEl = document.getElementById(ids.okEl);
    const button = form.querySelector('button[type="submit"]');
    errEl.textContent = '';
    okEl.style.display = 'none';
    if (!file || !file.name.toLowerCase().endsWith(ids.ext)) {
      errEl.textContent = `Selecciona un archivo con extension ${ids.ext}.`;
      return;
    }

    button.disabled = true;
    button.textContent = 'Subiendo...';
    try {
      const res = await fetch(`/api/admin/settings/client-download/${platform}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: file,
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      if (!res.ok) throw new Error(data.error || 'No se pudo subir el archivo');
      form.reset();
      okEl.textContent = `${ids.label} fue publicado correctamente.`;
      okEl.style.display = 'block';
      await refreshClientDownloadStatus();
    } catch (e) {
      errEl.textContent = e.message;
    } finally {
      button.disabled = false;
      button.textContent = 'Subir y publicar';
    }
  };
}

async function copyRustdeskKey() {
  const input = document.getElementById('rustdeskPublicKey');
  try {
    await navigator.clipboard.writeText(input.value);
  } catch (_) {
    input.select();
    document.execCommand('copy');
  }
  const okEl = document.getElementById('keyOk');
  okEl.textContent = 'Key copiada.';
  okEl.style.display = 'block';
}

async function rotateRustdeskKey() {
  const warning = 'Esta accion cambiara la key del servidor. Los clientes con la key anterior dejaran de conectar hasta que los actualices. ¿Generar una nueva key?';
  if (!confirm(warning)) return;
  const secondConfirmation = prompt('Escribe CAMBIAR KEY para confirmar:');
  if (secondConfirmation !== 'CAMBIAR KEY') return;

  const errEl = document.getElementById('keyErr');
  const okEl = document.getElementById('keyOk');
  errEl.textContent = '';
  okEl.style.display = 'none';
  try {
    const result = await api('/api/admin/settings/rustdesk-key/rotate', {
      method: 'POST',
      body: { confirm: true },
    });
    document.getElementById('rustdeskPublicKey').value = result.public_key;
    okEl.textContent = 'Nueva key generada. hbbs y hbbr se estan reiniciando.';
    okEl.style.display = 'block';
  } catch (e) {
    errEl.textContent = e.message;
  }
}
